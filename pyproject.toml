[project]
name = "minimail"
version = "0.0.1"
description = "Personal read-only local mirror of an Exchange Online mailbox and calendar, searchable offline."
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "msal>=1.31",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "structlog>=26.1",
]

[project.scripts]
minimail = "minimail.cli:main"

[dependency-groups]
dev = [
    "pytest>=9", "pytest-cov>=7",
    "mypy>=2", "ruff>=0.16", "pre-commit>=4.6", "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimail"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
disallow_any_generics = true
strict_optional = true
warn_return_any = true

# msal ships no type stubs
[[tool.mypy.overrides]]
module = ["msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v --tb=short --strict-markers"
markers = ["live: hits the real mailbox (needs a token); run with -m live"]
# A leaked sqlite connection fails the run instead of scrolling past as a warning.
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["minimail"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
